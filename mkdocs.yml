site_name: takt
site_description: Run pyperformance and pyperf benchmarks and store the results in SQL databases.
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - Configuration: configuration.md
  - Commands: commands.md
  - Data model: data-model.md
  - API: api.md
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Home: Главная
            Configuration: Настройка
            Commands: Команды
            Data model: Модель данных
            API: API
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: false
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true
