[project]
name = "takt"
version = "0.1.0"
description = "Run pyperformance and pyperf benchmarks and store the results in SQL databases."
authors = [
    { name = "Shamil Abdulaev", email = "ashm.tech@proton.me" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
]

[project.scripts]
takt = "takt.cli.main:main"

[tool.poetry]
packages = [
    { include = "takt", from = "src" },
]
include = [
    { path = "src/takt/**/*.so", format = "wheel" },
]

[tool.poetry.build]
script = "build.py"
generate-setup-file = false

[build-system]
requires = [
    "poetry-core>=2.0.0,<3.0.0",
    "mypy>=2.3.1,<3",
    "setuptools>=80",
]
build-backend = "poetry.core.masonry.api"
