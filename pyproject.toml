[project]
name = "takt"
version = "0.1.0"
description = "Run pyperformance and pyperf benchmarks and store the results in SQL databases."
authors = [
    { name = "Shamil Abdulaev", email = "ashm.tech@proton.me" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
    "pyperf>=2.10.0,<2.11",
    "pyperformance>=1.14.0,<1.15",
    "rich>=15,<16",
]

[project.optional-dependencies]
db = [
    "pymysql>=1.2,<2",
]

[project.scripts]
takt = "takt.cli.main:main"

[tool.poetry]
packages = [
    { include = "takt", from = "src" },
]
include = [
    { path = "src/takt/**/*.so", format = "wheel" },
]

[tool.poetry.build]
script = "build.py"
generate-setup-file = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-cov = "^7.1"
pytest-xdist = "^3.8"
testcontainers = { version = "^4.15", extras = ["mysql"] }
ruff = "0.16.9"
wemake-python-styleguide = { version = "^1.8.1", python = ">=3.14,<4.0" }
mypy = "^2.3.1"
setuptools = ">=80"
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.7"
mkdocs-static-i18n = "^1.3.1"
mkdocstrings = { version = "^1.0.6", extras = ["python"] }

[build-system]
requires = [
    "poetry-core>=2.0.0,<3.0.0",
    "mypy>=2.3.1,<3",
    "setuptools>=80",
]
build-backend = "poetry.core.masonry.api"
