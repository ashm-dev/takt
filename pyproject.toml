[project]
name = "takt"
version = "0.1.0"
description = "Run pyperformance and pyperf benchmarks and store the results in SQL databases."
authors = [
    { name = "Shamil Abdulaev", email = "ashm.tech@proton.me" },
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
    "pyperf>=2.10.0,<2.11",
    "pyperformance>=1.14.0,<1.15",
    "rich>=15,<16",
]

[project.optional-dependencies]
db = [
    "pymysql>=1.2,<2",
]

[project.scripts]
takt = "takt.cli.main:main"

[tool.poetry]
packages = [
    { include = "takt", from = "src" },
]
include = [
    { path = "src/takt/**/*.so", format = "wheel" },
]

[tool.poetry.build]
script = "build.py"
generate-setup-file = false

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-cov = "^7.1"
pytest-xdist = "^3.8"
testcontainers = { version = "^4.15", extras = ["mysql"] }
ruff = "0.16.9"
wemake-python-styleguide = { version = "^1.8.1", python = ">=3.14,<4.0" }
mypy = "^2.3.1"
setuptools = ">=80"
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.7"
mkdocs-static-i18n = "^1.3.1"
mkdocstrings = { version = "^1.0.6", extras = ["python"] }

[tool.ruff]
line-length = 80
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "TC001",
    "TC002",
    "TC003",
    "UP040",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "D", "INP001"]
"src/takt/infrastructure/db/migrations/**/*.py" = ["INP001"]
"build.py" = ["INP001"]
"src/takt/__init__.py" = ["RUF022"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src", "tests", "build.py"]
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
]

[[tool.mypy.overrides]]
module = [
    "pyperf",
    "pyperf.*",
    "pyperformance",
    "pyperformance.*",
    "testcontainers",
    "testcontainers.*",
    "setuptools",
    "setuptools.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
    "--cov=takt",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=90",
]
markers = [
    "slow: runs real benchmarks and takes more than 10 seconds",
    "mariadb: needs Docker to start MariaDB through testcontainers",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["takt"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.$",
]

[build-system]
requires = [
    "poetry-core>=2.0.0,<3.0.0",
    "mypy>=2.3.1,<3",
    "setuptools>=80",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2",
    "rich>=15,<16",
]
build-backend = "poetry.core.masonry.api"
