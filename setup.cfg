[flake8]
format = wemake
show-source = true
select = WPS
max-line-length = 80
allowed-domain-names = value, values
extend-exclude =
    .venv,
    build,
    dist,
    site
per-file-ignores =
    tests/*.py: WPS118, WPS201, WPS202, WPS214, WPS218, WPS226, WPS358, WPS432, WPS442, WPS459
    src/takt/__init__.py: WPS410, WPS412
    src/takt/api.py: WPS201
    src/takt/domain/model/run_metadata.py: WPS114
    src/takt/application/ports/target_session.py: WPS214
    src/takt/infrastructure/db/sqlalchemy_target_session.py: WPS214
    src/takt/infrastructure/db/suite_row_reader.py: WPS201, WPS202
    # WPS204: migrations write every column out in full, so expressions repeat.
    src/takt/infrastructure/db/migrations/*.py: WPS102, WPS204, WPS226, WPS432
